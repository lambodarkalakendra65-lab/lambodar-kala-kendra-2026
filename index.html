<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lambodar Kala Kendra - Ganpati Murti Collection</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Rozha+One&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-red: #800000;
            --gold: #FFD700;
            --saffron: #FF9933;
            --dark-red: #4A0000;
            --light-bg: #FFF9F0;
            --text-dark: #2B2B2B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--text-dark);
        }

        /* Header Section */
        header {
            background: linear-gradient(135deg, var(--dark-red), var(--primary-red));
            color: var(--gold);
            text-align: center;
            padding: 40px 20px;
            border-bottom: 5px solid var(--gold);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        header h1 {
            font-family: 'Rozha One', serif;
            font-size: 3rem;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        header p {
            color: #fff;
            font-size: 1.2rem;
            margin-top: 10px;
        }

        /* Filter Controls Container */
        .controls-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-group label {
            font-weight: 600;
            color: var(--primary-red);
        }

        .btn-toggle {
            padding: 10px 20px;
            border: 2px solid var(--primary-red);
            background: transparent;
            color: var(--primary-red);
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-toggle.active, .btn-toggle:hover {
            background: var(--primary-red);
            color: var(--gold);
        }

        select {
            padding: 10px 15px;
            border: 2px solid var(--saffron);
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
            cursor: pointer;
        }

        /* Murti Gallery Grid */
        .gallery-grid {
            max-width: 1200px;
            margin: 0 auto 50px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 0 20px;
        }

        .card {
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid rgba(255, 215, 0, 0.3);
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
        }

        .card-tag {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            color: #fff;
            z-index: 2;
        }

        .tag-eco { background: #2e7d32; }
        .tag-pop { background: #c62828; }

        /* Image Wrapper & Zoom Hover Effect */
        .img-container {
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            transition: transform 0.4s ease;
            display: block;
        }

        .img-container:hover img {
            transform: scale(1.08);
        }

        .zoom-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .img-container:hover .zoom-overlay {
            opacity: 1;
        }

        .card-body {
            padding: 20px;
            text-align: center;
        }

        .card-body h3 {
            color: var(--primary-red);
            margin-bottom: 8px;
        }

        .card-body p {
            color: #666;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        .btn-enquire {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, var(--saffron), var(--primary-red));
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-enquire:hover {
            opacity: 0.9;
        }

        /* Common Modal Styling */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 450px;
            position: relative;
            border: 3px solid var(--gold);
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--primary-red);
            font-weight: bold;
        }

        .modal h2 {
            color: var(--primary-red);
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        /* Photo Zoom Modal */
        .zoom-modal-content {
            position: relative;
            max-width: 90%;
            max-height: 90vh;
            text-align: center;
        }

        .zoom-modal-content img {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 10px;
            border: 4px solid var(--gold);
            box-shadow: 0 0 20px rgba(255,215,0,0.5);
        }

        .zoom-close {
            position: absolute;
            top: -40px;
            right: 0;
            color: #fff;
            font-size: 2.2rem;
            cursor: pointer;
        }

        .zoom-caption {
            color: #fff;
            margin-top: 10px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        /* Footer */
        footer {
            background: var(--dark-red);
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-top: 3px solid var(--gold);
        }
    </style>
</head>
<body>

    <header>
        <h1>लंबोदर कला केंद्र</h1>
        <p>Bappa Ki Sabse Sundar Aur Aakarshak Murtiyan</p>
    </header>

    <div class="controls-container">
        <div class="filter-group">
            <label>Category:</label>
            <button class="btn-toggle active" onclick="filterCategory('all', this)">Sabhi (All)</button>
            <button class="btn-toggle" onclick="filterCategory('Eco-Friendly', this)">Eco-Friendly (Matti)</button>
            <button class="btn-toggle" onclick="filterCategory('POP', this)">POP Murti</button>
        </div>

        <div class="filter-group">
            <label for="sizeSelect">Height (Size):</label>
            <select id="sizeSelect" onchange="filterSize()">
                <option value="all">Sabhi Sizes (1ft - 10ft)</option>
                <option value="1">1 ft</option>
                <option value="1.5">1.5 ft</option>
                <option value="2">2 ft</option>
                <option value="2.5">2.5 ft</option>
                <option value="3">3 ft</option>
                <option value="4">4 ft</option>
                <option value="5">5 ft</option>
                <option value="6">6 ft</option>
                <option value="7">7 ft</option>
                <option value="8">8 ft</option>
                <option value="9">9 ft</option>
                <option value="10">10 ft</option>
            </select>
        </div>
    </div>

    <div class="gallery-grid" id="gallery"></div>

    <div class="modal" id="zoomModal" onclick="closeZoomModal()">
        <div class="zoom-modal-content" onclick="event.stopPropagation()">
            <span class="zoom-close" onclick="closeZoomModal()">&times;</span>
            <img id="zoomedImg" src="" alt="Zoomed Murti">
            <div class="zoom-caption" id="zoomCaption"></div>
        </div>
    </div>

    <div class="modal" id="enquiryModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2>Murti Booking Enquiry</h2>
            <form id="enquiryForm" onsubmit="sendWhatsApp(event)">
                <div class="form-group">
                    <label>Selected Murti:</label>
                    <input type="text" id="selectedMurti" readonly style="background: #f0f0f0;">
                </div>
                <div class="form-group">
                    <label>Aapka Naam:</label>
                    <input type="text" id="custName" required placeholder="Apna naam likhein">
                </div>
                <div class="form-group">
                    <label>Phone Number:</label>
                    <input type="tel" id="custPhone" required placeholder="Mobile number">
                </div>
                <div class="form-group">
                    <label>Message / Demand:</label>
                    <textarea id="custMsg" rows="3" placeholder="Koi special request ho toh likhein"></textarea>
                </div>
                <button type="submit" class="btn-enquire">
                    <i class="fa-brands fa-whatsapp"></i> WhatsApp Par Enquiry Bhejein
                </button>
            </form>
        </div>
    </div>

    <footer>
        <p>© 2026 Lambodar Kala Kendra. All Rights Reserved.</p>
    </footer>

    <script>const murtis = [
    {
        id: 1,
        name: "Lalbaugcha Raja Look",
        type: "POP",
        size: "1.5",
        img: "murti1.jpeg"  // <-- 'images/' hata diya
    },
    {
        id: 2,
        name: "Peshwai Turban Bappa",
        type: "POP",
        size: "1.5",
        img: "murti2.jpeg"  // <-- 'images/' hata diya
    },
    {
        id: 3,
        name: "Mayureshwar (Peacock Avatar)",
        type: "POP",
        size: "1.5",
        img: "murti3.jpeg"  // <-- 'images/' hata diya
    },
    {
        id: 4,
        name: "MURTI",
        type: "POP",
        size: "1.5",
        img: "murti4.jpeg"  // <-- 'images/' hata diya
    }
    // Baaki sabhi murtiyon ke liye bhi 'images/' hata dein...
];
                
        let currentCategory = 'all';
        let currentSize = 'all';

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            const filtered = murtis.filter(m => {
                const categoryMatch = currentCategory === 'all' || m.type === currentCategory;
                const sizeMatch = currentSize === 'all' || m.size === currentSize;
                return categoryMatch && sizeMatch;
            });

            if(filtered.length === 0) {
                gallery.innerHTML = `<h3 style="grid-column: 1/-1; text-align:center; color:#888;">Is category/size mein abhi koi murti available nahi hai.</h3>`;
                return;
            }

            filtered.forEach(item => {
                const tagClass = item.type === 'Eco-Friendly' ? 'tag-eco' : 'tag-pop';
                gallery.innerHTML += `
                    <div class="card">
                        <span class="card-tag ${tagClass}">${item.type}</span>
                        <div class="img-container" onclick="openZoomModal('${item.img}', '${item.name} (${item.type} - ${item.size}ft)')">
                            <img src="${item.img}" alt="${item.name}">
                            <div class="zoom-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i> &nbsp; Click to Zoom</div>
                        </div>
                        <div class="card-body">
                            <h3>${item.name}</h3>
                            <p><strong>Size:</strong> ${item.size} Feet</p>
                            <button class="btn-enquire" onclick="openModal('${item.name} (${item.type} - ${item.size}ft)')">
                                <i class="fa-solid fa-paper-plane"></i> Enquiry Karein
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.btn-toggle').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderGallery();
        }

        function filterSize() {
            currentSize = document.getElementById('sizeSelect').value;
            renderGallery();
        }

        /* Photo Zoom Functions */
        function openZoomModal(imgSrc, title) {
            document.getElementById('zoomedImg').src = imgSrc;
            document.getElementById('zoomCaption').innerText = title;
            document.getElementById('zoomModal').style.display = 'flex';
        }

        function closeZoomModal() {
            document.getElementById('zoomModal').style.display = 'none';
        }

        /* Form Functions */
        function openModal(murtiDetails) {
            document.getElementById('selectedMurti').value = murtiDetails;
            document.getElementById('enquiryModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('enquiryModal').style.display = 'none';
        }

        function sendWhatsApp(event) {
            event.preventDefault();
            const shopPhone = "919876543210"; // <-- Apna WhatsApp Number Yaha Daalein (With 91)
            const murti = document.getElementById('selectedMurti').value;
            const name = document.getElementById('custName').value;
            const phone = document.getElementById('custPhone').value;
            const msg = document.getElementById('custMsg').value;

            const text = `Namaste Lambodar Kala Kendra,%0A%0AMujhe is murti ki enquiry karni hai:%0A*Murti:* ${murti}%0A*Naam:* ${name}%0A*Number:* ${phone}%0A*Message:* ${msg}`;
            
            window.open(`https://wa.me/${shopPhone}?text=${text}`, '_blank');
            closeModal();
        }

        // Initial Load
        renderGallery();
    </script>
</body>
</html>
